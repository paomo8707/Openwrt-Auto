name: '统一源码构建入口'
description: '复用六套源码入口工作流的公共初始化、配置、seed 与构建准备流程'
inputs:
  repo-branch:
    description: '入口工作流选择的源码分支，仅用于显示步骤名称'
    required: false
    default: ''
outputs:
  ready:
    description: '最终 seed 是否已生成并通过检查'
    value: ${{ steps.info.outputs.ready }}
runs:
  using: "composite"
  steps:
    - name: 检查上游更新（如需请先同步）
      if: github.repository != 'datout/Openwrt-Auto'
      shell: bash
      run: |
        set -euo pipefail
        UPSTREAM_REPO="datout/Openwrt-Auto"
        UPSTREAM_BRANCH="main"

        git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
        git fetch upstream "${UPSTREAM_BRANCH}" --prune

        LOCAL_COMMIT="$(git rev-parse HEAD)"
        UPSTREAM_COMMIT="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

        if git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${LOCAL_COMMIT}"; then
          AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
          echo "::notice title=上游同步状态::当前提交已包含上游 main（ahead=${AHEAD}, behind=0）。"
          exit 0
        fi

        COMMON_BASE="$(git merge-base "${LOCAL_COMMIT}" "${UPSTREAM_COMMIT}" 2>/dev/null || true)"
        if [[ -z "${COMMON_BASE}" ]]; then
          echo "::error title=仓库与上游无共同历史::当前提交与 ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} 没有共同祖先，请先处理 Git 历史后再编译。"
          echo "::notice title=同步路径::Actions -> Sync upstream -> Run workflow。"
          exit 1
        fi

        # 只有真正影响编译框架的上游变化才要求 Fork 先 Sync。
        # 用户自定义层与文档/维护工作流不会阻断现有 Fork 编译。
        is_non_compile_change() {
          local path="$1"
          case "${path}" in
            # 文档、许可证和历史备份不参与编译。
            README*|*/README*|NEXT_TEST.md|*/NEXT_TEST.md|LICENSE*|*/LICENSE*|*.md|docs/*|*/docs/*|backups/*)
              return 0
              ;;
            # 官方维护/自检文件不应迫使普通 Fork 为编译而同步。
            .github/workflows/validate.yml|.github/workflows/sync-upstream.yml|.github/workflows/packaging.yml|.github/workflows/institution.yml|.github/workflows/update-adguardhome-api-cache.yml|common/tests/*|common/.github/workflows/*|.github/actions/*/.github/workflows/*)
              return 0
              ;;
            # 自动维护的数据与同步器本身不改变当前 Fork 的编译框架。
            common/language/AdGuardHome.api|common/sync-upstream.sh)
              return 0
              ;;
          esac

          # Fork 用户自定义层。严格限定为 build/<源码>/ 下的直接文件或指定目录，
          # 避免 Bash case 的 * 跨目录误把 relevance/settings.ini 等框架文件放行。
          if [[ "${path}" =~ ^build/[^/]+/(settings\.ini|diy-part\.sh)$ ]]; then
            return 0
          fi
          if [[ "${path}" =~ ^build/[^/]+/(seed|diy|files|patches)/.+$ ]]; then
            return 0
          fi

          return 1
        }

        mapfile -t BLOCKING_FILES < <(
          git diff --name-only --no-renames "${COMMON_BASE}" "${UPSTREAM_COMMIT}" |
            while IFS= read -r path; do
              [[ -n "${path}" ]] || continue
              if ! is_non_compile_change "${path}"; then
                printf '%s\n' "${path}"
              fi
            done
        )

        if ((${#BLOCKING_FILES[@]})); then
          BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"
          AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
          echo "::error title=需要先同步上游::上游存在 ${#BLOCKING_FILES[@]} 个影响编译的文件变更（ahead=${AHEAD}, behind=${BEHIND}）。"
          echo "以下上游文件会影响当前编译框架："
          printf '  %s\n' "${BLOCKING_FILES[@]:0:50}"
          if ((${#BLOCKING_FILES[@]} > 50)); then
            echo "  ... 其余 $(( ${#BLOCKING_FILES[@]} - 50 )) 个文件未展开"
          fi
          echo "::notice title=同步路径::Actions -> Sync upstream -> Run workflow。"
          exit 1
        fi

        BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"
        AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
        echo "::notice title=上游更新可直接编译::上游新增 ${BEHIND} 个提交仅包含非编译相关变更（ahead=${AHEAD}, behind=${BEHIND}），无需 Sync upstream。"

    - name: 检测密钥 / 文件
      uses: ./.github/actions/mishi

    - name: 部署配置环境
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        APT_LISTCHANGES_FRONTEND: none
      shell: bash
      run: |
        set -euo pipefail
        timeout 20m bash -s <<'SETUP_ENV'
        set -euo pipefail
        sudo -E apt-get -qq -o Acquire::Retries=3 update
        sudo -E apt-get -qq -o Acquire::Retries=3 install -y \
          gawk git gettext libssl-dev xsltproc zip wget curl grep \
          python2.7 python3 python3-pip libpython3-dev jq

        sudo ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
        echo "${TZ}" | sudo tee /etc/timezone >/dev/null

        WORK_ROOT="/${DIY_WORK:?DIY_WORK 未设置}"
        if [[ "${WORK_ROOT}" == "/" || "${WORK_ROOT}" == "//" ]]; then
          echo "::error::拒绝把仓库工作目录设置为系统根目录"
          exit 1
        fi
        sudo install -d -m 0755 -o "${USER}" -g "$(id -gn)" "${WORK_ROOT}"
        echo "配置工作目录已准备：${WORK_ROOT}"
        SETUP_ENV

    - name: 下载 ${{ env.FOLDER_NAME }}-${{ inputs['repo-branch'] }} 源码
      working-directory: /${{ env.DIY_WORK }}
      shell: bash
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sfn "/${DIY_WORK}/openwrt" "${GITHUB_WORKSPACE}/openwrt"
        bash ${{ env.COMMON_SH }} Diy_feedsconf
        echo "SHANG_CHUAN=true" >> ${GITHUB_ENV}

    - name: 公告
      continue-on-error: true
      uses: ./.github/actions/message

    - name: 准备 ${{ env.FOLDER_NAME }}-${{ inputs['repo-branch'] }} 自定义配置
      uses: ./.github/actions/prepare

    - name: SSH menuconfig
      if: env.SSH_ACTION == 'true'
      uses: datout/debugger-action@d0b87ac0f7002b14754dec9d7b92f3029e49a36c

    - name: 生成并校验最终 seed
      id: info
      uses: ./.github/actions/need

    - name: 上传配置快照
      if: steps.info.outputs.ready == 'true' && env.SHANG_CHUAN == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: .config_${{ env.SOURCE }}_${{ env.LUCI_EDITION }}_${{ env.TARGET_PROFILE }}_${{ env.CONFIG_DATE }}
        path: |
          ${{ env.CONFIG_TXT }}
          ${{ env.COMPILE_PATH }}/relevance/${{ env.CONFIG_FILE }}.full.config
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: ./.github/actions/message
