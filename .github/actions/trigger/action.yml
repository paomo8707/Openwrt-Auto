name: '两阶段编译交接'
description: '保存最终 seed 并触发独立的第二阶段编译'
outputs:
  handoff_commit:
    description: '第二阶段固定使用的提交 SHA'
    value: ${{ steps.handoff.outputs.handoff_commit }}
  run_url:
    description: '第二阶段工作流地址（GitHub 返回时）'
    value: ${{ steps.handoff.outputs.run_url }}
runs:
  using: "composite"
  steps:
    - name: 保存配置并触发独立编译
      id: handoff
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"

        if [[ -z "${REPO_TOKEN:-}" ]]; then
          echo "::error::缺少 REPO_TOKEN，无法保存 seed 或触发第二阶段编译。"
          exit 1
        fi

        # common.sh 会把本次实际构建参数写到 runner 临时的 relevance/settings.ini。
        # 这里只读取它用于构造 dispatch 上下文，不再把该运行态文件提交到仓库。
        RUNTIME_SETTINGS="${COMPILE_PATH}/relevance/settings.ini"
        if [[ -s "${RUNTIME_SETTINGS}" ]]; then
          # shellcheck disable=SC1090
          source "${RUNTIME_SETTINGS}"
        fi

        FINAL_SEED="${GITHUB_WORKSPACE}/build/${FOLDER_NAME}/seed/${CONFIG_FILE}"
        if [[ ! -s "${FINAL_SEED}" ]]; then
          echo "::error::最终 seed 不存在或为空：${FINAL_SEED}"
          exit 1
        fi

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "${TMP_DIR}"' EXIT
        cp -f "${FINAL_SEED}" "${TMP_DIR}/seed"

        echo "准备保存本次 seed：build/${FOLDER_NAME}/seed/${CONFIG_FILE}"
        BASE_COMMIT="$(git rev-parse HEAD)"
        git fetch origin "${GIT_REFNAME}"
        REMOTE_COMMIT="$(git rev-parse "origin/${GIT_REFNAME}")"

        # menuconfig 可能持续较久。若期间有人更新了当前分支，宁可停止本次交接，
        # 也不把旧环境生成的 seed 自动 rebase 到一套更新后的代码上。
        if [[ "${BASE_COMMIT}" != "${REMOTE_COMMIT}" ]]; then
          echo "::error::远端分支在 menuconfig 期间发生变化。为保证可复现性，本次不自动合并，也不会 force push。"
          echo "启动时提交: ${BASE_COMMIT}"
          echo "当前远端提交: ${REMOTE_COMMIT}"
          exit 1
        fi

        git reset --hard "${BASE_COMMIT}"
        mkdir -p "build/${FOLDER_NAME}/seed"
        cp -f "${TMP_DIR}/seed" "build/${FOLDER_NAME}/seed/${CONFIG_FILE}"
        git add "build/${FOLDER_NAME}/seed/${CONFIG_FILE}"

        if git diff --cached --quiet; then
          echo "seed 与启动时云端版本一致，无需产生新提交。"
        else
          git commit -m "config: update ${FOLDER_NAME}/${CONFIG_FILE} seed"

          PUSH_OK=false
          for attempt in 1 2 3; do
            echo "推送 seed（${attempt}/3）..."
            if git push "https://x-access-token:${REPO_TOKEN}@github.com/${GIT_REPOSITORY}.git" "HEAD:${GIT_REFNAME}"; then
              PUSH_OK=true
              break
            fi

            git fetch origin "${GIT_REFNAME}" || true
            CURRENT_REMOTE="$(git rev-parse "origin/${GIT_REFNAME}" 2>/dev/null || true)"
            if [[ -n "${CURRENT_REMOTE}" && "${CURRENT_REMOTE}" != "${BASE_COMMIT}" ]]; then
              echo "::error::推送期间远端分支已更新，本次停止；不会 rebase 或 force push。"
              exit 1
            fi
            sleep $((attempt * 2))
          done

          if [[ "${PUSH_OK}" != "true" ]]; then
            echo "::error::seed 推送失败，已停止；未使用 force push。"
            exit 1
          fi
        fi

        SEED_COMMIT="$(git rev-parse HEAD)"
        HANDOFF_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "第二阶段固定使用提交：${SEED_COMMIT}"
        echo "交接标识：${HANDOFF_ID}"

        # 所有运行参数封装成一个 JSON input，避免修改 compile.yml / relevance/start。
        export CTX_FOLDER_NAME="${FOLDER_NAME}"
        export CTX_SOURCE_CODE="${SOURCE_CODE}"
        export CTX_REPO_BRANCH="${REPO_BRANCH}"
        export CTX_CONFIG_FILE="${CONFIG_FILE}"
        export CTX_INFORMATION_NOTICE="${INFORMATION_NOTICE}"
        export CTX_KEEP_WORKFLOWS="${KEEP_WORKFLOWS}"
        export CTX_KEEP_RELEASES="${KEEP_RELEASES}"
        export CTX_UPLOAD_FIRMWARE="${UPLOAD_FIRMWARE}"
        export CTX_UPLOAD_RELEASE="${UPLOAD_RELEASE}"
        export CTX_CACHEWRTBUILD_SWITCH="${CACHEWRTBUILD_SWITCH}"
        export CTX_UPDATE_FIRMWARE_ONLINE="${UPDATE_FIRMWARE_ONLINE}"
        export CTX_COMPILATION_INFORMATION="${COMPILATION_INFORMATION}"
        export CTX_ERRUN_NUMBER="${RUN_NUMBER:-${GITHUB_RUN_NUMBER}}"
        export CTX_SOURCE_RUN_ID="${GITHUB_RUN_ID}"
        export CTX_SOURCE_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
        export CTX_HANDOFF_ID="${HANDOFF_ID}"

        BUILD_CONTEXT="$(python3 - <<'PY'
        import json, os
        mapping = {
            'FOLDER_NAME': 'CTX_FOLDER_NAME',
            'SOURCE_CODE': 'CTX_SOURCE_CODE',
            'REPO_BRANCH': 'CTX_REPO_BRANCH',
            'CONFIG_FILE': 'CTX_CONFIG_FILE',
            'INFORMATION_NOTICE': 'CTX_INFORMATION_NOTICE',
            'KEEP_WORKFLOWS': 'CTX_KEEP_WORKFLOWS',
            'KEEP_RELEASES': 'CTX_KEEP_RELEASES',
            'UPLOAD_FIRMWARE': 'CTX_UPLOAD_FIRMWARE',
            'UPLOAD_RELEASE': 'CTX_UPLOAD_RELEASE',
            'CACHEWRTBUILD_SWITCH': 'CTX_CACHEWRTBUILD_SWITCH',
            'UPDATE_FIRMWARE_ONLINE': 'CTX_UPDATE_FIRMWARE_ONLINE',
            'COMPILATION_INFORMATION': 'CTX_COMPILATION_INFORMATION',
            'ERRUN_NUMBER': 'CTX_ERRUN_NUMBER',
            'SOURCE_RUN_ID': 'CTX_SOURCE_RUN_ID',
            'SOURCE_RUN_ATTEMPT': 'CTX_SOURCE_RUN_ATTEMPT',
            'HANDOFF_ID': 'CTX_HANDOFF_ID',
        }
        print(json.dumps({k: os.environ.get(v, '') for k, v in mapping.items()}, ensure_ascii=False, separators=(',', ':')))
        PY
        )"

        export DISPATCH_REF="${GIT_REFNAME}"
        export DISPATCH_CONTEXT="${BUILD_CONTEXT}"
        export DISPATCH_SEED_COMMIT="${SEED_COMMIT}"
        PAYLOAD="$(python3 - <<'PY'
        import json, os
        print(json.dumps({
            'ref': os.environ['DISPATCH_REF'],
            'inputs': {
                'BUILD_CONTEXT': os.environ['DISPATCH_CONTEXT'],
                'SEED_COMMIT': os.environ['DISPATCH_SEED_COMMIT'],
            },
        }, ensure_ascii=False, separators=(',', ':')))
        PY
        )"

        API_VERSION="2026-03-10"
        RESPONSE_FILE="${TMP_DIR}/dispatch-response.json"
        CURL_RC=0
        HTTP_CODE=""

        # POST 不做盲目重试，避免请求已被 GitHub 接收时重复触发编译。
        set +e
        HTTP_CODE="$(curl --location --silent --show-error \
          --connect-timeout 10 --max-time 60 \
          -o "${RESPONSE_FILE}" -w '%{http_code}' \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${REPO_TOKEN}" \
          -H "X-GitHub-Api-Version: ${API_VERSION}" \
          "https://api.github.com/repos/${GIT_REPOSITORY}/actions/workflows/compile.yml/dispatches" \
          -d "${PAYLOAD}")"
        CURL_RC=$?
        set -e

        RUN_URL=""
        if [[ "${CURL_RC}" == "0" && "${HTTP_CODE}" == "200" && -s "${RESPONSE_FILE}" ]]; then
          RUN_URL="$(jq -r '.html_url // empty' "${RESPONSE_FILE}" 2>/dev/null || true)"
        fi

        # GitHub 旧响应可能是 204；网络也可能在服务端已接收 POST 后断开。
        # 用唯一交接标识查询第二阶段，既确认是否已触发，也避免重复 POST。
        find_dispatched_run() {
          local runs_file="${TMP_DIR}/workflow-runs.json"
          if ! curl --location --silent --show-error \
            --connect-timeout 10 --max-time 15 \
            --get \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            --data-urlencode "branch=${GIT_REFNAME}" \
            --data-urlencode "event=workflow_dispatch" \
            --data-urlencode "per_page=20" \
            "https://api.github.com/repos/${GIT_REPOSITORY}/actions/workflows/compile.yml/runs" \
            -o "${runs_file}"; then
            return 1
          fi
          jq -r --arg handoff "${HANDOFF_ID}" \
            '[.workflow_runs[] | select((.display_title // "") | contains($handoff))] | sort_by(.created_at) | last | .html_url // empty' \
            "${runs_file}" 2>/dev/null || true
        }

        if [[ -z "${RUN_URL}" ]]; then
          for attempt in 1 2 3 4 5 6; do
            RUN_URL="$(find_dispatched_run || true)"
            [[ -n "${RUN_URL}" ]] && break
            sleep 5
          done
        fi

        if [[ "${CURL_RC}" != "0" ]]; then
          if [[ -n "${RUN_URL}" ]]; then
            echo "::warning::触发请求连接异常（curl=${CURL_RC}），但已确认第二阶段创建成功。"
          else
            echo "::error::触发请求未正常返回（curl=${CURL_RC}），且未找到对应第二阶段。为避免重复编译，本次不自动重发 POST。"
            exit 1
          fi
        elif [[ "${HTTP_CODE}" != "200" && "${HTTP_CODE}" != "204" ]]; then
          if [[ -n "${RUN_URL}" ]]; then
            echo "::warning::GitHub API 返回 HTTP ${HTTP_CODE}，但已确认第二阶段创建成功。"
          else
            echo "::error::触发 compile.yml 失败，GitHub API HTTP ${HTTP_CODE}"
            cat "${RESPONSE_FILE}" || true
            exit 1
          fi
        fi

        if [[ -n "${RUN_URL}" ]]; then
          echo "独立编译已触发：${RUN_URL}"
        else
          # 204 已表示请求被接受；仅在旧 API 不返回 run URL 时使用总入口。
          RUN_URL="https://github.com/${GIT_REPOSITORY}/actions/workflows/compile.yml"
          echo "独立编译已触发：${RUN_URL}"
        fi

        echo "handoff_commit=${SEED_COMMIT}" >> "${GITHUB_OUTPUT}"
        echo "run_url=${RUN_URL}" >> "${GITHUB_OUTPUT}"
        echo "TZ_Message=$(date +%Y年%m月%d号%H时%M分)" >> "${GITHUB_ENV}"

    - name: 发送编译触发通知
      if: (env.PUSH_PLUS_TOKEN && env.INFORMATION_NOTICE == 'PUSH' && steps.handoff.outcome == 'success') || (env.TELEGRAM_BOT_TOKEN && env.INFORMATION_NOTICE == 'TG' && steps.handoff.outcome == 'success')
      shell: bash
      run: |
        if [[ "${{ env.INFORMATION_NOTICE }}" == "TG" ]]; then
          curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -X POST -H "Content-Type: application/json" \
            -d '{"chat_id":"${{env.TELEGRAM_CHAT_ID}}", "text":"已保存配置并触发独立编译：${{env.SOURCE}}-${{env.LUCI_EDITION}} / ${{env.TARGET_PROFILE}}（${{env.WAREHOUSE_MAN}}-#${{env.RUN_NUMBER}}），${{env.TZ_Message}}"}' \
            "https://api.telegram.org/bot${{env.TELEGRAM_BOT_TOKEN}}/sendMessage" || true
        fi
        if [[ "${{ env.INFORMATION_NOTICE }}" == "PUSH" ]]; then
          curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -X POST -H "Content-Type: application/json" \
            -d '{"token":"${{env.PUSH_PLUS_TOKEN}}","title":"已触发独立编译 ${{env.SOURCE}}-${{env.LUCI_EDITION}}","content":"编译 ${{env.TARGET_PROFILE}} 固件（${{env.WAREHOUSE_MAN}}-#${{env.RUN_NUMBER}}），${{env.TZ_Message}}"}' \
            "https://www.pushplus.plus/send" || true
        fi
branding:
  icon: "terminal"
  color: "gray-dark"
