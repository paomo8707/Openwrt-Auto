#
#
#
# 因为SSH连接配置固件直接编译，会给github停止编译的,所以要另外触发启动编译程序
#
# 一般情况下都能触发启动编译的，除非没设置好密匙，或者密匙过期了，或者密匙错误之类的
#
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#
#

name: LEDE-源码
on:
  workflow_dispatch:
    inputs:
      REPO_BRANCH:
        description: 'LEDE源码'
        required: true
        default: 'master'
        type: choice
        options:
          - 'master'
      CONFIG_FILE:
        description: '请选择配置文件'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'armsr_rootfs_tar_gz'
          - 'asus_rt-ac42u'
          - 'd-team_newifi-d2'
          - 'p2w_r619ac-128m'
          - 'phicomm_n1'
          - 'phicomm_k2p'
          - 'phicomm_k3'
          - 'x86_32'
          - 'x86_64'
          - 'xiaoyu_xy-c5'
      INFORMATION_NOTICE:
        description: 'Telegram或pushplus信息通知'
        required: true
        default: '关闭'
        type: choice
        options:
          - '关闭'
          - 'Telegram'
          - 'Pushplus'
      KEEP_WORKFLOWS:
        description: '清理workflows,保留[X]个runs不被清理'
        required: true
        default: '20'
      KEEP_RELEASES:
        description: '清理Releases,保留[X]个Releases不被清理'
        required: true
        default: '10'
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'true'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'false'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '在线更新固/打包aarch64系列为img固件'
        required: false
        default: 'true'
        type: boolean


# 如若启动定时编译的话,配置文件是设置对应文件夹内的settings.ini文件
# 定时触发开启编译(把下面两个#去掉开启,时间设置请看定时开启编译说明)
#  schedule:
#   - cron: 35 18 * * *

concurrency:
  group: configure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 本流程需要两个写权限（缺一不可）：
#   contents: write —— 把最终 seed 提交推回仓库
#   actions: write  —— 用 workflow_dispatch 触发第二阶段的 compile.yml
permissions:
  contents: write
  actions: write


jobs:
  build:
    name: 启动"${{ matrix.target }}-${{ github.event.inputs.REPO_BRANCH }}"触发编译
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    
    env:
      FOLDER_NAME: ${{ matrix.target }}
      GIT_REPOSITORY: ${{github.repository}}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Shanghai
      DIY_WORK: workdir
    strategy:
      fail-fast: false
      matrix:
        target: [Lede]
        
        # 请勿对 target: [Lede] 做任何修改
        
    steps:
    - name: 检出自动化仓库
      uses: actions/checkout@v5
      with:
        # 关键：checkout 默认把 GITHUB_TOKEN 写入 http.https://github.com/.extraheader，
        # 该 header 优先于 URL 里的 userinfo，导致 .github/actions/trigger 的 push
        # 变成 github-actions[bot] 身份（只读 → 403）。关闭持久化凭据，push 才真正用 REPO_TOKEN。
        persist-credentials: false

    - name: 检查上游更新（如需请先同步）
      if: github.repository != 'datout/Openwrt-Auto'
      shell: bash
      run: |
        set -e
        UPSTREAM_REPO="datout/Openwrt-Auto"
        UPSTREAM_BRANCH="main"
        VER_FILE="UPSTREAM_VERSION"
        git fetch --prune --unshallow 2>/dev/null || true
        git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
        git fetch upstream "${UPSTREAM_BRANCH}" --prune
        
        LOCAL_VER=""
        if [ -f "${VER_FILE}" ]; then
          LOCAL_VER="$(tr -d '\r\n' < "${VER_FILE}")"
        fi
        UP_VER="$(git show "upstream/${UPSTREAM_BRANCH}:${VER_FILE}" 2>/dev/null | tr -d '\r\n' || true)"
        
        # If versions match, allow build even if there are doc-only commits ahead.
        if [ -n "${LOCAL_VER}" ] && [ -n "${UP_VER}" ] && [ "${LOCAL_VER}" = "${UP_VER}" ]; then
          exit 0
        fi
        
        behind=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo 0)
        echo "::error title=需要先同步上游::你的仓库落后 ${UPSTREAM_REPO} (behind=${behind})。请先到 Actions 运行【Sync upstream】同步后再重跑本流程。"
        echo "::notice title=路径::Actions → Sync upstream → Run workflow（如看不到该流程：先用 GitHub 的 Sync fork 同步一次）"
        exit 1
    - name: 检测密钥 / 文件 / 版本
      uses: ./.github/actions/mishi

    - name: 部署配置环境
      timeout-minutes: 20
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        APT_LISTCHANGES_FRONTEND: none
      shell: bash
      run: |
        set -euo pipefail
        sudo -E apt-get -qq -o Acquire::Retries=3 update
        sudo -E apt-get -qq -o Acquire::Retries=3 install -y \
          gawk git gettext libssl-dev xsltproc zip wget curl grep \
          python2.7 python3 python3-pip libpython3-dev jq

        sudo ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
        echo "${TZ}" | sudo tee /etc/timezone >/dev/null

        WORK_ROOT="/${DIY_WORK:?DIY_WORK 未设置}"
        if [[ "${WORK_ROOT}" == "/" || "${WORK_ROOT}" == "//" ]]; then
          echo "::error::拒绝把仓库工作目录设置为系统根目录"
          exit 1
        fi
        sudo install -d -m 0755 -o "${USER}" -g "$(id -gn)" "${WORK_ROOT}"
        echo "配置工作目录已准备：${WORK_ROOT}"

    - name: 下载 ${{ matrix.target }}-${{ inputs.REPO_BRANCH }} 源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sfn "/${DIY_WORK}/openwrt" "${GITHUB_WORKSPACE}/openwrt"
        bash ${{ env.COMMON_SH }} Diy_feedsconf
        echo "SHANG_CHUAN=true" >> ${GITHUB_ENV}
    
    - name: 公告
      continue-on-error: true
      uses: ./.github/actions/message
 
    - name: 准备 ${{ matrix.target }}-${{ inputs.REPO_BRANCH }} 自定义配置
      uses: ./.github/actions/prepare

    - name: SSH menuconfig
      if: env.SSH_ACTION == 'true'
      uses: datout/debugger-action@d0b87ac0f7002b14754dec9d7b92f3029e49a36c

    - name: 生成并校验最终 seed
      id: info
      uses: ./.github/actions/need

    - name: 上传配置快照
      if: steps.info.outputs.ready == 'true' && env.SHANG_CHUAN == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: .config_${{ env.SOURCE }}_${{ env.LUCI_EDITION }}_${{ env.TARGET_PROFILE }}_${{ env.CONFIG_DATE }}
        path: |
          ${{ env.CONFIG_TXT }}
          ${{ env.COMPILE_PATH }}/relevance/${{ env.CONFIG_FILE }}.full.config
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: ./.github/actions/message

    - name: 触发 ${{ matrix.target }}-${{ inputs.REPO_BRANCH }} 编译
      if: steps.info.outputs.ready == 'true'
      timeout-minutes: 5
      uses: ./.github/actions/trigger
