#
# 第二阶段：独立纯编译流程
# 由第一阶段保存 seed 后通过 workflow_dispatch 显式触发。
# 不再依赖修改 compile.yml / relevance/start / force push。
#

name: 编译主程序
run-name: >-
  编译 ${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-${{ fromJSON(inputs.BUILD_CONTEXT).REPO_BRANCH }}-${{ fromJSON(inputs.BUILD_CONTEXT).CONFIG_FILE }}（来源 #${{ fromJSON(inputs.BUILD_CONTEXT).ERRUN_NUMBER }}｜${{ fromJSON(inputs.BUILD_CONTEXT).HANDOFF_ID }}）
on:
  workflow_dispatch:
    inputs:
      BUILD_CONTEXT:
        description: '第一阶段生成的构建上下文 JSON（自动传递，请勿手动修改）'
        required: true
        type: string
      SEED_COMMIT:
        description: '第一阶段保存 seed 后的精确提交 SHA'
        required: true
        type: string

concurrency:
  group: compile-${{ github.ref }}-${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-${{ fromJSON(inputs.BUILD_CONTEXT).CONFIG_FILE }}
  cancel-in-progress: false

env:
  GIT_REPOSITORY: ${{ github.repository }}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Shanghai
  DIY_WORK: workdir
  BUILD_CONTEXT: ${{ inputs.BUILD_CONTEXT }}
  FOLDER_NAME: ${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}
  SOURCE_CODE: ${{ fromJSON(inputs.BUILD_CONTEXT).SOURCE_CODE }}
  REPO_BRANCH: ${{ fromJSON(inputs.BUILD_CONTEXT).REPO_BRANCH }}
  CONFIG_FILE: ${{ fromJSON(inputs.BUILD_CONTEXT).CONFIG_FILE }}
  INFORMATION_NOTICE: ${{ fromJSON(inputs.BUILD_CONTEXT).INFORMATION_NOTICE }}
  KEEP_WORKFLOWS: ${{ fromJSON(inputs.BUILD_CONTEXT).KEEP_WORKFLOWS }}
  KEEP_RELEASES: ${{ fromJSON(inputs.BUILD_CONTEXT).KEEP_RELEASES }}
  UPLOAD_FIRMWARE: ${{ fromJSON(inputs.BUILD_CONTEXT).UPLOAD_FIRMWARE }}
  UPLOAD_RELEASE: ${{ fromJSON(inputs.BUILD_CONTEXT).UPLOAD_RELEASE }}
  CACHEWRTBUILD_SWITCH: ${{ fromJSON(inputs.BUILD_CONTEXT).CACHEWRTBUILD_SWITCH }}
  UPDATE_FIRMWARE_ONLINE: ${{ fromJSON(inputs.BUILD_CONTEXT).UPDATE_FIRMWARE_ONLINE }}
  COMPILATION_INFORMATION: ${{ fromJSON(inputs.BUILD_CONTEXT).COMPILATION_INFORMATION }}
  ERRUN_NUMBER: ${{ fromJSON(inputs.BUILD_CONTEXT).ERRUN_NUMBER }}
  SOURCE_RUN_ID: ${{ fromJSON(inputs.BUILD_CONTEXT).SOURCE_RUN_ID }}
  SOURCE_RUN_ATTEMPT: ${{ fromJSON(inputs.BUILD_CONTEXT).SOURCE_RUN_ATTEMPT }}
  HANDOFF_ID: ${{ fromJSON(inputs.BUILD_CONTEXT).HANDOFF_ID }}

jobs:
  build:
    name: 编译 "${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}"
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
    - name: 校验并显示两阶段构建上下文
      shell: bash
      run: |
        set -euo pipefail
        for name in FOLDER_NAME SOURCE_CODE REPO_BRANCH CONFIG_FILE SOURCE_RUN_ID HANDOFF_ID; do
          if [[ -z "${!name:-}" ]]; then
            echo "::error::BUILD_CONTEXT 缺少 ${name}"
            exit 1
          fi
        done
        if [[ -z "${{ inputs.SEED_COMMIT }}" ]]; then
          echo "::error::缺少 SEED_COMMIT"
          exit 1
        fi
        echo "配置来源提交: ${{ inputs.SEED_COMMIT }}"
        echo "源码类型: ${FOLDER_NAME} / ${SOURCE_CODE}"
        echo "源码分支: ${REPO_BRANCH}"
        echo "配置文件: ${CONFIG_FILE}"
        echo "交接标识: ${HANDOFF_ID}"
        echo "第一阶段: https://github.com/${GIT_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: false
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        
    - name: 检出配置来源提交
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.SEED_COMMIT }}
        token: ${{ env.REPO_TOKEN }}
        fetch-depth: 0

    - name: 检查上游更新（仅提示）
      if: github.repository != 'datout/Openwrt-Auto'
      shell: bash
      run: |
        set -euo pipefail
        UPSTREAM_REPO="datout/Openwrt-Auto"
        UPSTREAM_BRANCH="main"

        UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
        if git remote get-url upstream >/dev/null 2>&1; then
          if ! git remote set-url upstream "${UPSTREAM_URL}"; then
            echo "::warning title=上游同步检查暂不可用::无法配置 upstream 远程仓库。这不会阻止本次编译，当前 Fork 将继续使用本地代码。"
            exit 0
          fi
        else
          if ! git remote add upstream "${UPSTREAM_URL}"; then
            echo "::warning title=上游同步检查暂不可用::无法添加 upstream 远程仓库。这不会阻止本次编译，当前 Fork 将继续使用本地代码。"
            exit 0
          fi
        fi

        if ! git fetch upstream "${UPSTREAM_BRANCH}" --prune; then
          echo "::warning title=上游同步检查暂不可用::无法获取 ${UPSTREAM_REPO}/${UPSTREAM_BRANCH}。这不会阻止本次编译，当前 Fork 将继续使用本地代码。"
          exit 0
        fi

        LOCAL_COMMIT="$(git rev-parse HEAD)"
        UPSTREAM_COMMIT="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
        AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
        BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"

        if git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${LOCAL_COMMIT}"; then
          echo "::notice title=上游同步状态::当前提交已包含上游 main（ahead=${AHEAD}, behind=0）。"
          exit 0
        fi

        COMMON_BASE="$(git merge-base "${LOCAL_COMMIT}" "${UPSTREAM_COMMIT}" 2>/dev/null || true)"
        if [[ -z "${COMMON_BASE}" ]]; then
          echo "::warning title=上游同步提示::当前 Fork 与 ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} 没有共同 Git 历史。当前编译将继续，但如果你希望跟随官方框架更新，建议先 Sync upstream。"
          exit 0
        fi

        mapfile -t UPSTREAM_FILES < <(
          git diff --name-only --no-renames "${COMMON_BASE}" "${UPSTREAM_COMMIT}" |
            sed '/^$/d'
        )

        echo "::warning title=上游同步提示::当前 Fork 落后 upstream ${BEHIND} 个提交（ahead=${AHEAD}, behind=${BEHIND}）。同步 upstream 是推荐操作，但不会阻止本次编译。"
        if ((${#UPSTREAM_FILES[@]})); then
          echo "上游相对共同基线的文件变更（最多显示 50 个）："
          printf '  %s\n' "${UPSTREAM_FILES[@]:0:50}"
          if ((${#UPSTREAM_FILES[@]} > 50)); then
            echo "  ... 其余 $(( ${#UPSTREAM_FILES[@]} - 50 )) 个文件未展开"
          fi
        fi
        echo "提示：当前编译继续使用你 Fork 中的代码；如需获得官方最新框架修复，请执行 Sync upstream。"
    - name: 检测密钥 / 文件
      uses: ./.github/actions/mishi
        
    - name: 部署编译环境
      timeout-minutes: 45
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        APT_LISTCHANGES_FRONTEND: none
      shell: bash
      run: |
        set -euo pipefail
        echo "开始安装 OpenWrt 编译依赖"
        sudo -E bash "${GITHUB_WORKSPACE}/common/custom/ubuntu.sh"
        echo "编译依赖脚本执行完成"

        sudo ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
        echo "${TZ}" | sudo tee /etc/timezone >/dev/null
        echo "时区设置完成：${TZ}"

        WORK_ROOT="/${DIY_WORK:?DIY_WORK 未设置}"
        if [[ "${WORK_ROOT}" == "/" || "${WORK_ROOT}" == "//" ]]; then
          echo "::error::拒绝把编译工作目录设置为系统根目录"
          exit 1
        fi
        sudo install -d -m 0755 -o "${USER}" -g "$(id -gn)" "${WORK_ROOT}"
        echo "编译工作目录已准备：${WORK_ROOT}"
        df -h "${WORK_ROOT}"
        free -h

    - name: 下载 ${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-${{ fromJSON(inputs.BUILD_CONTEXT).REPO_BRANCH }} 源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sfn "/${DIY_WORK}/openwrt" "${GITHUB_WORKSPACE}/openwrt"
        bash ${{ env.COMMON_SH }} Diy_feedsconf
    
    - name: 公告
      continue-on-error: true
      uses: ./.github/actions/message
 
    - name: 准备自定义配置
      uses: ./.github/actions/prepare

    - name: 生成并校验最终 seed
      uses: ./.github/actions/need
        
    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: ./.github/actions/message

    - name: 生成构建清单和缓存标识
      id: build_meta
      shell: bash
      run: |
        bash "${GITHUB_WORKSPACE}/common/custom/build_manifest.sh"

    - name: 准备源码下载缓存
      id: dl_cache_meta
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${HOME_PATH}/dl"
        echo "path=$(readlink -f "${HOME_PATH}")/dl" >> "${GITHUB_OUTPUT}"
        echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

    - name: 缓存源码下载目录
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.dl_cache_meta.outputs.path }}
        key: openwrt-dl-v1-${{ runner.os }}-${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-${{ fromJSON(inputs.BUILD_CONTEXT).REPO_BRANCH }}-${{ steps.dl_cache_meta.outputs.week }}
        restore-keys: |
          openwrt-dl-v1-${{ runner.os }}-${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-${{ fromJSON(inputs.BUILD_CONTEXT).REPO_BRANCH }}-
          openwrt-dl-v1-${{ runner.os }}-${{ fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME }}-

    - name: 缓存加速
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121 # pinned main
      with:
        ccache: 'true'
        mixkey: "${{ steps.build_meta.outputs.cache_mixkey }}"
        prefix: ${{ github.workspace }}/openwrt

    - name: 预下载并校验软件包
      id: package
      run: |
        set -euxo pipefail
        cd openwrt

        mkdir -p tmp/aria2c

        # 固定 server-stat 文件：让 aria2 在本次 job 内持续积累“哪个镜像更快”
        export ARIA2C_OPTIONS="\
          --connect-timeout=20 --timeout=20 --max-tries=20 --retry-wait=3 \
          --lowest-speed-limit=200K \
          --uri-selector=adaptive \
          --server-stat-of=$PWD/tmp/aria2c/serverstat \
          --server-stat-if=$PWD/tmp/aria2c/serverstat \
          --server-stat-timeout=86400 \
        "

        # 正式编译前先把最终 .config 所需源码下载并完成 hash 校验。
        # dl/ 会被后续 make 直接复用，不会重复下载。
        echo "预下载并校验最终配置所需源码包..."
        make download -j4 V=s CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c

    - name: 开始编译固件
      id: compile
      if: steps.package.outcome == 'success'
      shell: bash
      run: |
        cd openwrt
        export BUILD_LOG="${RUNNER_TEMP}/openwrt-build.log"
        bash "${GITHUB_WORKSPACE}/common/custom/compile_firmware.sh"

    - name: 缓存命中统计
      if: ${{ always() && env.CACHEWRTBUILD_SWITCH == 'true' && steps.package.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      run: |
        cd openwrt
        export CCACHE_DIR="$PWD/.ccache"
        echo "===== ccache 统计 ====="
        if command -v ccache >/dev/null 2>&1; then
          ccache -s
        elif [[ -x staging_dir/host/bin/ccache ]]; then
          staging_dir/host/bin/ccache -s
        else
          echo "未找到 ccache 命令，跳过命中率统计"
        fi
        echo "===== 缓存目录大小 ====="
        du -sh .ccache 2>/dev/null || true
        du -sh dl 2>/dev/null || true

    - name: 生成失败诊断包
      id: diagnostics
      if: failure() && steps.package.outcome == 'success'
      shell: bash
      run: |
        export BUILD_LOG="${RUNNER_TEMP}/openwrt-build.log"
        bash "${GITHUB_WORKSPACE}/common/custom/build_diagnostics.sh"

    - name: 上传失败诊断包
      if: failure() && steps.diagnostics.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.diagnostics.outputs.name }}
        path: ${{ steps.diagnostics.outputs.dir }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14

    - name: 上传构建清单
      continue-on-error: true
      if: steps.compile.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-${{ env.FOLDER_NAME }}-${{ env.CONFIG_FILE }}-${{ github.run_number }}
        path: ${{ steps.build_meta.outputs.manifest }}
        if-no-files-found: error
        retention-days: 30

    - name: 打包 armsr_rootfs_tar_gz
      if: steps.compile.outcome == 'success' && env.ONLINE_FIRMWARE == 'true'
      uses: ./.github/actions/aarch

    - name: 整理固件输出
      continue-on-error: true
      if: steps.compile.outcome == 'success'
      run: |
        cd openwrt
        bash ${{ env.COMMON_SH }} Diy_firmware

    - name: 发布在线更新固件
      continue-on-error: true
      if: steps.compile.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true'
      uses: ./.github/actions/cloud
        
    - name: 上传固件 / Release / 通知
      if: steps.compile.outcome == 'success'
      uses: ./.github/actions/uploads
