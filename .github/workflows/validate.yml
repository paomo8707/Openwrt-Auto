name: 项目自检

on:
  push:
    branches:
      - main
      - next
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.repository == 'datout/Openwrt-Auto' }}
    name: Shell / YAML / Workflow / 两阶段交接检查
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Shell 语法检查
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find common build -type f -name '*.sh' -print | sort)
          (( ${#files[@]} > 0 )) || { echo '未发现需要检查的 Shell 文件'; exit 1; }
          for file in "${files[@]}"; do
            bash -n "${file}"
          done

      - name: AutoUpdate x86 启动模式回归检查
        shell: bash
        run: bash common/tests/autoupdate_x86_boot_mode.sh

      - name: ShellCheck 严格检查
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -x -e SC2154 \
            common/lib/core.sh \
            common/lib/feeds.sh \
            common/lib/sources.sh \
            common/custom/compile_firmware.sh \
            common/custom/build_manifest.sh \
            common/custom/build_diagnostics.sh

      - name: ShellCheck 迁移模块观察
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrated_modules < <(
            find common/lib -maxdepth 1 -type f -name '*.sh' \
              ! -name 'core.sh' ! -name 'feeds.sh' ! -name 'sources.sh' \
              -print | sort
          )
          if (( ${#migrated_modules[@]} > 0 )); then
            shellcheck -x -e SC2154 -S error "${migrated_modules[@]}"
            shellcheck -x -e SC2154 "${migrated_modules[@]}" || true
          fi
          if ! shellcheck -x -e SC2154 common/custom/ubuntu.sh; then
            echo '::warning title=ShellCheck 迁移模块观察::common/custom/ubuntu.sh 存在 ShellCheck 诊断，但该历史模块不作为阻断门禁。'
          fi

      - name: 检查 Fork 编译认证
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/Lede.yml \
            .github/workflows/Immortalwrt.yml \
            .github/workflows/Lienol.yml \
            .github/workflows/Mt798x.yml \
            .github/workflows/Official.yml \
            .github/workflows/Xwrt.yml \
            .github/workflows/compile.yml; do
            grep -q 'uses: actions/checkout@v5' "${file}"
            grep -q '^        token: \${{ env.REPO_TOKEN }}$' "${file}"
          done
          echo "OK: 编译阶段 checkout 使用 REPO_TOKEN，避免 GITHUB_TOKEN 覆盖 PAT"

      - name: YAML 语法检查
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path('.github').rglob('*.yml')) + sorted(Path('.github').rglob('*.yaml'))
          for path in files:
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f'OK {path}')
          PY

      - name: Actionlint Workflow 检查（变更门禁）
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL --retry 3 --retry-delay 2 "${URL}" -o "/tmp/${ARCHIVE}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp actionlint

          case "${GITHUB_EVENT_NAME}" in
            pull_request) BASE_SHA="${{ github.event.pull_request.base.sha }}" ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              if [[ "${BASE_SHA}" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
              ;;
            *) BASE_SHA="$(git rev-parse HEAD^)" ;;
          esac

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error title=Actionlint 门禁无法确定基准提交::无法找到 ${BASE_SHA}，不能安全地区分历史问题与本次新增问题。"
            exit 1
          fi

          rm -rf /tmp/actionlint-base
          git worktree add --detach --quiet /tmp/actionlint-base "${BASE_SHA}"

          set +e
          (cd /tmp/actionlint-base && /tmp/actionlint -oneline -no-color > /tmp/actionlint.base.out 2>&1)
          BASE_RC=$?
          /tmp/actionlint -oneline -no-color > /tmp/actionlint.current.out 2>&1
          CURRENT_RC=$?
          git worktree remove --force /tmp/actionlint-base >/dev/null 2>&1 || true
          set -e

          if (( BASE_RC >= 2 )); then
            echo "::error title=Actionlint 基准检查失败::基准提交的 Actionlint 无法正常执行（exit=${BASE_RC}）。"
            cat /tmp/actionlint.base.out
            exit 1
          fi
          if (( CURRENT_RC >= 2 )); then
            echo "::error title=Actionlint 当前检查失败::当前提交的 Actionlint 无法正常执行（exit=${CURRENT_RC}）。"
            cat /tmp/actionlint.current.out
            exit 1
          fi

          normalize_actionlint() {
            sed -E \
              -e 's#^([^:]+):[0-9]+:[0-9]+: #\1: #' \
              -e 's#(shellcheck reported issue in this script: [^:]+:[^:]+:)[0-9]+:[0-9]+:#\1#' \
              | sort -u
          }
          normalize_actionlint < /tmp/actionlint.base.out > /tmp/actionlint.base.sorted
          normalize_actionlint < /tmp/actionlint.current.out > /tmp/actionlint.current.sorted
          comm -13 /tmp/actionlint.base.sorted /tmp/actionlint.current.sorted > /tmp/actionlint.new.out

          if [[ -s /tmp/actionlint.current.sorted ]]; then
            echo "===== 当前 Actionlint 诊断 ====="
            cat /tmp/actionlint.current.sorted
          else
            echo "Actionlint 检查通过"
          fi

          if [[ -s /tmp/actionlint.new.out ]]; then
            echo "===== 新增 Actionlint 诊断 ====="
            cat /tmp/actionlint.new.out
            while IFS= read -r diagnostic; do
              [[ -n "${diagnostic}" ]] || continue
              echo "::error title=新增 Actionlint 问题::${diagnostic}"
            done < /tmp/actionlint.new.out
            exit 1
          fi

          if [[ -s /tmp/actionlint.current.sorted ]]; then
            echo "::warning title=Actionlint 历史问题::检测到历史 Actionlint 诊断，但没有发现本次新增问题，因此不阻断项目自检。"
          fi

      - name: 版本体系与路径一致性检查
        shell: bash
        run: |
          set -euo pipefail
          test ! -e UPSTREAM_VERSION
          ! find build -type f -path '*/relevance/actions_version' -print -quit | grep -q .
          ! grep -RIn --exclude-dir=.git --exclude-dir=backups \
            --exclude=validate.yml --exclude=sync-upstream.yml --exclude=sync-upstream.sh \
            -E 'ACTIONS_VERSION|actions_version|UPSTREAM_VERSION' .

          for workflow in Immortalwrt Lede Lienol Mt798x Official Xwrt; do
            file=".github/workflows/${workflow}.yml"
            grep -q 'uses: ./\.github/actions/build-entry' "${file}"
            grep -q 'uses: ./\.github/actions/trigger' "${file}"
          done
          grep -q 'git merge-base --is-ancestor' .github/actions/build-entry/action.yml
          grep -q 'git rev-list --count' .github/actions/build-entry/action.yml
          grep -q 'git merge-base --is-ancestor' .github/workflows/compile.yml
          grep -q 'git diff --name-only --no-renames' .github/actions/build-entry/action.yml
          grep -q 'git diff --name-only --no-renames' .github/workflows/compile.yml
          grep -q '上游同步提示' .github/actions/build-entry/action.yml
          grep -q '上游同步提示' .github/workflows/compile.yml
          grep -q '上游同步检查暂不可用' .github/actions/build-entry/action.yml
          grep -q '上游同步检查暂不可用' .github/workflows/compile.yml
          grep -q '无法配置 upstream 远程仓库' .github/actions/build-entry/action.yml
          grep -q '无法配置 upstream 远程仓库' .github/workflows/compile.yml
          grep -q '无法添加 upstream 远程仓库' .github/actions/build-entry/action.yml
          grep -q '无法添加 upstream 远程仓库' .github/workflows/compile.yml
          ! grep -q '需要先同步上游' .github/actions/build-entry/action.yml
          ! grep -q '需要先同步上游' .github/workflows/compile.yml
          ! grep -q 'is_non_compile_change' .github/actions/build-entry/action.yml
          ! grep -q 'is_non_compile_change' .github/workflows/compile.yml


          if grep -RInE --exclude-dir=.git --exclude-dir=backups --exclude=validate.yml \
            'BENDI_VERSION|OPERATES_PATH|OPERATE_SEED|build/operates|/tmp/common|seed_refresh\.sh' \
            common build .github/actions; then
            echo '发现已废弃的编译架构残留'
            exit 1
          fi
          test ! -e common/custom/seed_refresh.sh
          grep -q 'COMPILE_PATH="\$GITHUB_WORKSPACE/build/\${FOLDER_NAME}"' .github/actions/mishi/action.yml
          ! grep -q 'cp -Rf build .*operates' .github/actions/mishi/action.yml
          grep -q 'local runtime_root=' common/custom/first.sh
          grep -q 'DIY_RUNTIME_DIR=' common/custom/first.sh

      - name: common.sh 模块化边界检查
        shell: bash
        run: |
          set -euo pipefail
          modules=(core git feeds sources config firmware bootstrap checkout finalize definition prevent)
          for module in "${modules[@]}"; do
            grep -q "source \"\${COMMON_LIB_DIR}/${module}.sh\"" common/common.sh
            test -s "common/lib/${module}.sh"
          done

          moved_functions=(
            TIME variable detect_upstream_luci_edition Diy_feed_postprocess
            Diy_COOLSNOWWOLF Diy_OFFICIAL Diy_partsh Diy_scripts Diy_profile Diy_firmware gitsvn
            Diy_variable Diy_feedsconf Diy_checkout Diy_management Diy_definition Diy_prevent
          )
          for fn in "${moved_functions[@]}"; do
            ! grep -q "^function ${fn}()" common/common.sh
            [[ "$(grep -Rh "^function ${fn}()" common/lib | wc -l | tr -d ' ')" == "1" ]]
          done

          menus=(Diy_menu Diy_menu2 Diy_menu3 Diy_menu4 Diy_menu5 Diy_menu6)
          for fn in "${menus[@]}"; do grep -q "^function ${fn}()" common/common.sh; done
          (( $(wc -l < common/common.sh) < 200 ))

          tmp_env="$(mktemp)"
          GITHUB_ENV="${tmp_env}" bash -c '
            source common/common.sh
            for fn in TIME variable detect_upstream_luci_edition Diy_feed_postprocess \
              Diy_COOLSNOWWOLF Diy_OFFICIAL Diy_partsh Diy_scripts Diy_profile Diy_firmware gitsvn \
              Diy_variable Diy_feedsconf Diy_checkout Diy_management Diy_definition Diy_prevent \
              Diy_menu Diy_menu2 Diy_menu3 Diy_menu4 Diy_menu5 Diy_menu6; do
              declare -F "${fn}" >/dev/null || exit 1
            done
          '
          rm -f "${tmp_env}"

      - name: 源码入口与两阶段交接检查
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude=validate.yml 'actions/checkout@v4|actions/upload-artifact@v4|actions/cache@v4' .github; then
            echo '发现仍使用 Node.js 20 的官方 Action 旧主版本'
            exit 1
          fi
          grep -RInE 'actions/checkout@v5|actions/upload-artifact@v7|actions/cache@v5' .github >/dev/null

          ! grep -nE 'git[[:space:]]+push.*(--force|[[:space:]]-f([[:space:]]|$))' .github/actions/trigger/action.yml
          ! grep -nE "^[[:space:]]+-[[:space:]]*['\"]?build/.*/relevance/start" .github/workflows/compile.yml
          grep -q 'actions/workflows/compile.yml/dispatches' .github/actions/trigger/action.yml
          grep -q 'SEED_COMMIT' .github/workflows/compile.yml
          grep -q 'BUILD_CONTEXT' .github/workflows/compile.yml
          test -s .github/actions/prepare/action.yml
          grep -q '^  ready:' .github/actions/need/action.yml
          grep -q '^  ready:' .github/actions/build-entry/action.yml
          grep -q 'uses: ./.github/actions/prepare' .github/actions/build-entry/action.yml
          grep -q 'uses: ./.github/actions/need' .github/actions/build-entry/action.yml
          grep -q "if: steps.info.outputs.ready == 'true'" .github/actions/build-entry/action.yml

          for workflow in Immortalwrt Lede Lienol Mt798x Official Xwrt; do
            file=".github/workflows/${workflow}.yml"
            [[ "$(grep -c 'uses: ./\.github/actions/build-entry' "${file}")" == "1" ]]
            [[ "$(grep -c 'uses: ./\.github/actions/trigger' "${file}")" == "1" ]]
            [[ "$(grep -c 'uses: actions/checkout@v5' "${file}")" == "1" ]]
            checkout_line="$(grep -n 'uses: actions/checkout@v5' "${file}" | head -n1 | cut -d: -f1)"
            entry_line="$(grep -n 'uses: ./\.github/actions/build-entry' "${file}" | head -n1 | cut -d: -f1)"
            [[ -n "${checkout_line}" && -n "${entry_line}" && "${checkout_line}" -lt "${entry_line}" ]]
            grep -q 'repo-branch: ${{ inputs.REPO_BRANCH }}' "${file}"
            grep -q 'fetch-depth: 0' "${file}"
            grep -q 'timeout-minutes: 5' "${file}"
            ! grep -q 'git merge-base --is-ancestor' "${file}"
            ! grep -q 'uses: ./.github/actions/mishi' "${file}"
            ! grep -q 'uses: ./.github/actions/prepare' "${file}"
            ! grep -q 'uses: ./.github/actions/need' "${file}"
            ! grep -q 'datout/debugger-action@' "${file}"
            ! grep -q 'name: 上传配置快照' "${file}"
          done

      - name: 编译诊断与构建清单检查
        shell: bash
        run: |
          set -euo pipefail
          grep -q '单线程 V=s 获取真实失败包' common/custom/compile_firmware.sh
          grep -q 'xray_failed' common/custom/compile_firmware.sh
          ! grep -q 'Build failed, trying fallback (gvisor go1.26 fix)' .github/workflows/compile.yml
          grep -q 'build_diagnostics.sh' .github/workflows/compile.yml
          grep -q 'build_manifest.sh' .github/workflows/compile.yml
          grep -q 'actions/upload-artifact@v7' .github/workflows/compile.yml
          grep -q 'name.endswith(".tmp")' common/custom/build_manifest.sh
          grep -q -- '--show-toplevel' common/custom/build_manifest.sh
          grep -q 'KERNEL_PATCHVER' common/custom/build_manifest.sh
          grep -q 'GO_VERSION_MAJOR_MINOR' common/custom/build_manifest.sh
          grep -q 'openwrt_go_declared' common/custom/build_manifest.sh
          grep -q '"schema": 3' common/custom/build_manifest.sh

      - name: Feed / 缓存 / 源码步骤名检查
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'github\.com/yingziwu/(openwrt-fakehttp|luci-app-fakehttp)' build/Lede/diy-part.sh build/Immortalwrt/diy-part.sh
          grep -q 'src-git datout https://github.com/datout/openwrt-package.git' common/lib/checkout.sh
          grep -q 'luci-app-fakehttp' build/Lede/relevance/x86_64.full.config
          grep -q 'fakehttp' build/Lede/relevance/x86_64.full.config

          test -s common/config/datout-priority-packages.txt
          grep -q '_load_datout_priority_packages' common/lib/feeds.sh
          ! grep -q 'legacy_conflicts=' common/lib/feeds.sh
          ! grep -qx 'smartdns' common/config/datout-priority-packages.txt
          ! grep -qx 'luci-app-smartdns' common/config/datout-priority-packages.txt
          grep -q 'SOURCE.*!=.*Lede.*SOURCE.*!=.*Immortalwrt' common/lib/checkout.sh
          grep -q 'prefer_upstream_xray' common/lib/feeds.sh
          grep -q '匹配上游 Go 工具链' common/lib/feeds.sh

          grep -qx 'CONFIG_TARGET_x86=y' build/Immortalwrt/seed/x86_64
          grep -q '_validate_immortalwrt_x86_seed' common/lib/config.sh
          grep -q '_validate_immortalwrt_x86_target' common/lib/config.sh
          grep -q 'minimal seed 重新展开后的 .config' common/custom/seed_finalize.sh
          ! grep -q 'validate_immortalwrt_x86_target "${MINIMAL_SEED}"' common/custom/seed_finalize.sh
          grep -q 'actions/cache@v5' .github/workflows/compile.yml
          grep -q 'stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121' .github/workflows/compile.yml
          ! grep -q 'cachewrtbuild@main' .github/workflows/compile.yml
          grep -q '缓存源码下载目录' .github/workflows/compile.yml
          grep -q '缓存命中统计' .github/workflows/compile.yml
          grep -q 'dl_cache_meta.outputs.path' .github/workflows/compile.yml
          grep -q 'fromJSON(inputs.BUILD_CONTEXT).FOLDER_NAME' .github/workflows/compile.yml
          ! grep -nE '^[[:space:]]*-[[:space:]]+name:.*env\.FOLDER_NAME' .github/workflows/compile.yml

      - name: Actions / 发布 / 运行时回归检查
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function ensure_node_package_manager_hosts()' common/lib/feeds.sh
          grep -q 'source_hint=.*SOURCE_CODE' common/lib/feeds.sh
          grep -q '\*immortalwrt\*' common/lib/feeds.sh
          grep -qE '^[[:space:]]*ensure_node_package_manager_hosts$' common/lib/feeds.sh
          grep -q 'openwrt-24.10/lang/node-yarn' common/lib/feeds.sh
          grep -q 'openwrt-24.10/lang/node-pnpm' common/lib/feeds.sh
          grep -q 'package/compat' common/lib/feeds.sh

          test -s .github/actions/build-entry/action.yml
          grep -q '^  repo-branch:' .github/actions/build-entry/action.yml
          grep -q 'datout/debugger-action@d0b87ac0f7002b14754dec9d7b92f3029e49a36c' .github/actions/build-entry/action.yml
          grep -q 'actions/upload-artifact@v7' .github/actions/build-entry/action.yml
          grep -q 'timeout 20m bash -s' .github/actions/build-entry/action.yml
          ! grep -q 'debugger-action@' .github/actions/need/action.yml
          ! grep -q 'actions/upload-artifact@' .github/actions/need/action.yml
          ! grep -RIn -- "name: 'My Composite Action'" .github/actions

          for workflow in Immortalwrt Lede Lienol Mt798x Official Xwrt; do
            file=".github/workflows/${workflow}.yml"
            grep -q '^  DIY_WORK: workdir$' "${file}"
            ! grep -qE 'sudo (mkdir -p|chown)[^#]* /\$\{\{ env\.DIY_WORK \}\}' "${file}"
          done
          grep -q 'uses: ./.github/actions/prepare' .github/workflows/compile.yml
          grep -q 'API_VERSION="2026-03-10"' .github/actions/trigger/action.yml
          grep -q -- '--connect-timeout 10 --max-time 60' .github/actions/trigger/action.yml
          grep -q 'HTTP_CODE.*200' .github/actions/trigger/action.yml
          grep -q 'HTTP_CODE.*204' .github/actions/trigger/action.yml
          grep -q 'HANDOFF_ID' .github/actions/trigger/action.yml
          grep -q '^run-name:' .github/workflows/compile.yml
          grep -q 'HANDOFF_ID' .github/workflows/compile.yml
          ! grep -q 'SSH远程连接文字提示' .github/actions/need/action.yml
          ! grep -q 'name: 安装 aria2' .github/workflows/compile.yml
          grep -qE '^[[:space:]]*jq rename pigz clang gnupg aria2([[:space:]]|$)' common/custom/ubuntu.sh
          grep -q '^\* text=auto eol=lf$' .gitattributes

          grep -q 'WORK_ROOT="/\${DIY_WORK:?DIY_WORK 未设置}"' .github/actions/build-entry/action.yml
          grep -q '拒绝把仓库工作目录设置为系统根目录' .github/actions/build-entry/action.yml
          grep -q 'WORK_ROOT="/\${DIY_WORK:?DIY_WORK 未设置}"' .github/workflows/compile.yml
          grep -q '拒绝把编译工作目录设置为系统根目录' .github/workflows/compile.yml
          ! grep -RInE --exclude-dir=backups 'sudo[[:space:]]+chown[^#]*(/|//)[[:space:]]*$' .github/workflows
          ! grep -qE 'apt-get[[:space:]]+(full-upgrade|dist-upgrade)' common/custom/ubuntu.sh
          ! grep -qE 'apt-get[[:space:]]+autoremove' common/custom/ubuntu.sh
          ! grep -RIn --exclude=validate.yml 'snap install jq' .github/workflows
          grep -q 'remove_swap: false' .github/workflows/compile.yml
          grep -q 'timeout-minutes: 45' .github/workflows/compile.yml

          publish_line="$(grep -n 'name: 发布在线更新固件' .github/actions/cloud/action.yml | head -n1 | cut -d: -f1)"
          cleanup_line="$(grep -n 'name: 清理在线更新旧固件并记录结果' .github/actions/cloud/action.yml | head -n1 | cut -d: -f1)"
          [[ -n "${publish_line}" && -n "${cleanup_line}" && "${publish_line}" -lt "${cleanup_line}" ]]
          for file in .github/actions/cloud/action.yml .github/actions/aarch/action.yml .github/actions/uploads/action.yml; do
            grep -q 'ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd' "${file}"
          done
          ! grep -RInE 'ncipollo/release-action@(v1|main|master)([[:space:]#]|$)' .github/actions
          grep -q 'endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1' .github/workflows/packaging.yml
          ! grep -RInE 'endersonmenezes/free-disk-space@(v3|main|master)([[:space:]#]|$)' .github/workflows
          grep -q "if: env.SAFE_BRANCH_MODE != 'true'" .github/actions/aarch/action.yml
          grep -q 'function is_current_build_asset()' common/custom/assets.sh
          grep -q '\${BIN_PATH}/\${asset_name}' common/custom/assets.sh

          while IFS= read -r -d '' settings_file; do
            bash -n "${settings_file}"
          done < <(find build -type f -name settings.ini -print0)

          bash common/tests/runtime_diy_script_permissions.sh
          bash common/tests/argon_feed_migration.sh

      - name: 预下载 / 旁路由 UCI 迁移检查
        shell: bash
        run: |
          set -euo pipefail
          download_line="$(grep -n 'name: 预下载并校验软件包' .github/workflows/compile.yml | head -n1 | cut -d: -f1)"
          compile_line="$(grep -n 'name: 开始编译固件' .github/workflows/compile.yml | head -n1 | cut -d: -f1)"
          [[ -n "${download_line}" && -n "${compile_line}" && "${download_line}" -lt "${compile_line}" ]]
          grep -q 'make download -j4 V=s CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c' .github/workflows/compile.yml
          grep -q 'dl/ 会被后续 make 直接复用' .github/workflows/compile.yml

          grep -q 'function _side_router_uses_uci_defaults' common/lib/definition.sh
          grep -q 'SOURCE_CODE:-.*IMMORTALWRT' common/lib/definition.sh
          grep -q 'openwrt_auto_side_router_defaults' common/lib/definition.sh
          grep -q '检测到已有旁路由配置，保留现有设置' common/lib/definition.sh
          grep -q '去桥接暂时保留 config_generate 兼容路径' common/lib/definition.sh

          tmp_defaults="$(mktemp)"
          source common/lib/definition.sh
          DEFAULT_PATH="${tmp_defaults}"
          _write_side_router_uci_defaults '10.0.0.253' '210.22.70.225 210.22.70.3' '10.0.0.255' '1'
          sh -n "${tmp_defaults}"
          grep -q "uci set network.lan.gateway='10.0.0.253'" "${tmp_defaults}"
          grep -q "uci set network.lan.dns='210.22.70.225 210.22.70.3'" "${tmp_defaults}"
          grep -q "uci set network.lan.broadcast='10.0.0.255'" "${tmp_defaults}"
          grep -q "uci set dhcp.lan.ignore='1'" "${tmp_defaults}"
          rm -f "${tmp_defaults}"

          SOURCE_CODE='COOLSNOWWOLF'
          side_router_modern='0'
          if _side_router_uses_uci_defaults; then
            echo 'LEDE 不应进入 ImmortalWrt uci-defaults 旁路由路径'
            exit 1
          fi
          SOURCE_CODE='IMMORTALWRT'
          side_router_modern='1'
          _side_router_uses_uci_defaults

      - name: Git 格式检查
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format=oneline HEAD >/dev/null
          fi
